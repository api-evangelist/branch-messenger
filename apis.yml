aid: branch-messenger

name: Branch

description: Branch provides a mobile measurement and deep linking platform that helps marketers and developers create, manage, and analyze deep
  links, attribution, and user engagement across apps and web. The service offers tools for link management, attribution analytics, fraud detection,
  and integration with advertising and analytics platforms, supporting a wide range of industries such as finance, retail, and media.

